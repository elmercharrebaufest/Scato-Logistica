<div id="section-to-print" class="mt-4 shadow" style="background-color: white; min-height: 5rem;"> 
    <div class="bg-white">
        <app-collapse-button collapseSelectorId="collapseGrafico"></app-collapse-button>
        <h4 class="colorTitle px-4 pt-4 pb-3 m-0">Gráfico de Celdas</h4>
    </div> 
    <div id="collapseGrafico" class="collapse show bg-white pb-2">
        <div id='colorMateriales' class="float-left text-center">
            <div *ngFor="let p of datosEmbarque.listaMateriales" class="colorMaterial">
                <div>{{p.descripcionCorta}}</div>
                <div style="width: 100%; height: 50%;" [ngStyle]="{'background-color': p.color ? p.color : 'white' }"></div>
            </div>
        </div>
        <select id="selectMateriales" class="form-control" [(ngModel)]="materialSeleccionado" style="padding: 0.1rem;">
            <option [ngValue]="null">Seleccione producto:</option>
            <ng-container *ngIf="datosEmbarque"><option *ngFor="let p of datosEmbarque.listaMateriales" [ngValue]="p">{{ p.descripcionCorta }}</option></ng-container>
        </select>
        <div id='colorLabel'>Color</div>
        <div class='custom-control tank-control custom-switch' id='toggleColorContainer'>
            <input type='checkbox' class='custom-control-input' id='toggleColor'
                [(ngModel)]="toggleColor">
            <label class='custom-control-label' for='toggleColor'></label>
        </div>
        <div id='prodLabel'>Prod</div>

        <div id='circuloLabel'>Circulo</div>
        <div class='custom-control tank-control custom-switch' id='toggleFormaContainer'>
            <input type='checkbox' class='custom-control-input' id='toggleForma'
                (change)="toggleFormaElementoGrafico()">
            <label class='custom-control-label' for='toggleForma'></label>
        </div>
        <div id='rectLabel'>Rectangulo</div>
        <div id='rotarLabel'>Rotación</div>
        <div class='custom-control tank-control custom-switch' id='toggleRotarContainer'>
            <input type='checkbox' class='custom-control-input' id='toggleRotar' [(ngModel)]="rotacionCheckbox"
                (change)="rotacionLastSelected()">
            <label class='custom-control-label' for='toggleRotar'></label>
        </div>

                <text x="25" y="100" class="text-datos-buque"><tspan class="text-buque-bold">Fecha:</tspan> {{hoy | date: 'dd/MM/yyyy'}}</text>
