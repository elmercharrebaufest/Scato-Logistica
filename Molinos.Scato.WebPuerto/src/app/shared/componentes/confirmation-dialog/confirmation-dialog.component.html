<div class="modal-header" [ngClass]="{'bg-danger': esTipoError(), 'bg-warning': esTipoWarning()}">
    <h4 class="modal-title">{{ title }}</h4>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body mb-4">
    <div [innerHTML]="inputTitle"></div>
    <tag-input  *ngIf="mail != null"  [(ngModel)]="mail.destinatarios" [modelAsStrings]="true"
    [placeholder]="'Destinatarios'" [secondaryPlaceholder]="'Destinatarios'" [validators]="validators"></tag-input>
    <div [innerHTML]="message"></div>
    <textarea wrap="off" class="form-control" *ngIf="mail != null" [(ngModel)]="mail.body" rows="10"></textarea>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="decline()" [hidden]="!btnCancelVisible()">{{ btnCancelText }}</button>
    <button type="button" ngbAutofocus class="btn btn-primary" (click)="accept()">{{ btnOkText }}</button>
</div>
